x-runtime: &runtime
    image: ${COMPOSE_PROJECT_NAME:-starter-local}-runtime
    build:
        context: .
        dockerfile: docker/local/Dockerfile
    init: true
    working_dir: /var/www/html
    environment:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
        DOCKER_LOCAL: '1'
        CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
        APP_PORT: ${APP_PORT:-8080}
        VITE_PORT: ${VITE_PORT:-5173}
    volumes:
        - .:/var/www/html
        - vendor:/var/www/html/vendor
        - node_modules:/var/www/html/node_modules
        - storage:/var/www/html/storage
        - bootstrap_cache:/var/www/html/bootstrap/cache

services:
    app:
        <<: *runtime
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 20

    web:
        image: nginx:1.28-alpine
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - storage:/var/www/html/storage:ro
            - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
            interval: 5s
            timeout: 5s
            retries: 20

    vite:
        <<: *runtime
        # Inertia reads public/hot for SSR. Sharing app's network makes localhost
        # resolve identically for PHP, Vite SSR and the developer's browser.
        network_mode: service:app
        command: [npm, run, dev]
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'curl --fail --silent http://127.0.0.1:$${VITE_PORT}/@vite/client > /dev/null',
                ]
            interval: 5s
            timeout: 5s
            retries: 30

    # Horizon master supervisor; worker limits live in config/horizon.php
    # (supervisor timeout 85 s < REDIS_QUEUE_RETRY_AFTER 90 s < grace 100 s).
    # After changing worker code run `make restart` or
    # `make artisan ARGS='horizon:terminate'` (Compose restarts the service).
    queue:
        <<: *runtime
        command: [php, artisan, horizon]
        restart: unless-stopped
        stop_grace_period: 100s
        depends_on:
            web:
                condition: service_healthy
        healthcheck:
            test: [CMD, php, artisan, horizon:status]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 20s

    scheduler:
        <<: *runtime
        command: [php, artisan, schedule:work]
        depends_on:
            web:
                condition: service_healthy

    postgres:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: ${DB_DATABASE:-starter}
            POSTGRES_USER: ${DB_USERNAME:-starter}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 3s
            timeout: 3s
            retries: 20

    redis:
        image: redis:8.2-alpine
        command: [redis-server, --appendonly, 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 3s
            timeout: 3s
            retries: 20

    # Malware scanner for DAM uploads (clamd over TCP 3310 inside the compose
    # network only; no host port). The first start downloads signatures into
    # the clamav volume, so the service may need a few minutes to turn
    # healthy. Tests use a fake scanner and never depend on it.
    clamav:
        image: clamav/clamav:1.5.4-debian
        environment:
            CLAMAV_NO_MILTERD: 'true'
            # Accept the 50 MB DAM limit over INSTREAM (default is 25 MB).
            CLAMD_CONF_StreamMaxLength: 52M
            CLAMD_CONF_MaxFileSize: 52M
            CLAMD_CONF_MaxScanSize: 200M
        volumes:
            - clamav:/var/lib/clamav
        healthcheck:
            test: [CMD, clamdcheck.sh]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 10m

    # One-off backup/restore runner (`make backup`, `make restore-drill`):
    # PostgreSQL 18 client tools matching the server, read-only access to the
    # storage volume, archives written to ./.backups on the host (gitignored).
    backup:
        image: postgres:18-bookworm
        profiles: [ops]
        user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
        entrypoint: [/bin/bash]
        working_dir: /opt/backup
        environment:
            HOME: /tmp
            PGHOST: postgres
            PGPORT: '5432'
            PGUSER: ${DB_USERNAME:-starter}
            PGPASSWORD: ${DB_PASSWORD:-local-development-only}
            PGDATABASE: ${DB_DATABASE:-starter}
            BACKUP_DIR: /backups
            BACKUP_STORAGE_PATH: /var/www/html/storage/app
            BACKUP_KEEP: ${BACKUP_KEEP:-7}
        volumes:
            - ./scripts/backup:/opt/backup:ro
            - ./.backups:/backups
            - storage:/var/www/html/storage:ro
        depends_on:
            postgres:
                condition: service_healthy

    mailpit:
        image: axllent/mailpit:v1.27
        ports:
            - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

    # Browser E2E (`make e2e`, profile e2e). SSR server of the production
    # build in app's network namespace, where Inertia expects it
    # (127.0.0.1:13714); used only while the Vite dev server is stopped.
    ssr:
        <<: *runtime
        profiles: [e2e]
        network_mode: service:app
        command: [php, artisan, inertia:start-ssr]
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'curl --fail --silent http://127.0.0.1:13714/health > /dev/null',
                ]
            interval: 3s
            timeout: 3s
            retries: 20

    # Official Playwright image pinned to @playwright/test in package.json:
    # browsers never install on the host. Reuses the node_modules volume and
    # reaches the app through nginx (http://web) on the compose network.
    playwright:
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        profiles: [e2e]
        init: true
        user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
        working_dir: /var/www/html
        command: [sleep, infinity]
        ipc: host
        environment:
            HOME: /tmp
            CI: ${CI:-}
            E2E_BASE_URL: http://web
            E2E_MAILPIT_URL: http://mailpit:8025
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        depends_on:
            web:
                condition: service_healthy

volumes:
    vendor:
    node_modules:
    storage:
    bootstrap_cache:
    postgres:
    redis:
    clamav:
