# Included by every server/location that uses add_header: Nginx 1.28 does
# not inherit add_header into a block that defines its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Request-Id $request_id always;
# HSTS: enable only after HTTPS works for every subdomain in use; start with a
# short max-age on staging. includeSubDomains/preload are separate decisions.
add_header Strict-Transport-Security "max-age=31536000" always;
