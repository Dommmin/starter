; PHP-FPM pool template for PHP 8.5 (/etc/php/8.5/fpm/pool.d/starter.conf).
; Sizing is a starting point for a small VM: measure memory per worker on
; staging (pm.max_children * worker RSS must fit next to PostgreSQL, Redis,
; Horizon and SSR).
[starter]
user = www-data
group = www-data

listen = /run/php/starter.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

; Longer than Nginx fastcgi_read_timeout (60 s) so Nginx answers first.
request_terminate_timeout = 65s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.5-fpm/starter-slow.log

; Worker stderr (json_stderr channel, fatal errors) reaches the FPM log/journal.
catch_workers_output = yes
decorate_workers_output = no

; The application reads its own .env; do not leak the host environment.
clear_env = yes

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 52M
php_admin_value[max_execution_time] = 60
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
; Code is immutable per release directory and requests use $realpath_root,
; so timestamps need not be checked (new release = new paths).
php_admin_flag[opcache.validate_timestamps] = off
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.max_accelerated_files] = 20000
