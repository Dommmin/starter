# Override used only by `make e2e` (docker compose -f compose.yaml -f
# compose.e2e.yaml). The web app runs as APP_ENV=e2e: in `local`
# User::isAdmin() and canAccessAdminPanel() grant every account full access,
# so role journeys (editor without audit/users) need a non-local environment.
# TrustHosts is active outside local, hence APP_URL is the host the
# Playwright container uses. Queue workers keep APP_ENV=local (Horizon has
# supervisors only for configured environments).
#
# The suite never touches the developer's data: app and queue use their own
# database (`<DB_DATABASE>_e2e`, rebuilt empty with migrate:fresh by
# `make e2e`, with its cache cleared; app:e2e-prepare then creates the
# accounts and the demo home sections) and their own Redis prefixes for cache, sessions and queues.
# `make e2e` switches app and queue back to the local ones afterwards.
services:
    app:
        environment:
            APP_ENV: e2e
            APP_URL: http://web
            DB_DATABASE: ${DB_DATABASE:-starter}_e2e
            REDIS_PREFIX: e2e-database-
            CACHE_PREFIX: e2e-cache-
            HORIZON_PREFIX: 'e2e-horizon:'

    queue:
        environment:
            DB_DATABASE: ${DB_DATABASE:-starter}_e2e
            REDIS_PREFIX: e2e-database-
            CACHE_PREFIX: e2e-cache-
            HORIZON_PREFIX: 'e2e-horizon:'
