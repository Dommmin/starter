# Production vhost template (native Nginx >= 1.28 + PHP-FPM, ADR-014/022).
# Install: /etc/nginx/sites-available/starter.conf (inside the http context),
# security headers: /etc/nginx/snippets/starter-security-headers.conf
# (deploy/nginx/security-headers.conf). Replace example.test, the
# certificate paths and /var/www/starter with the operator's values, then
# `nginx -t && systemctl reload nginx`. The Deployer recipe never edits it.
#
# Cache policy mirrors docker/local/nginx.conf (doc 10, "Cache i kompresja").

# JSON access log without query strings, cookies or auth headers (ADR-023).
log_format starter_json escape=json
    '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name example.test;
    server_tokens off;

    # ACME HTTP-01 (certbot --webroot); everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.test;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:starter_tls:10m;
    ssl_session_tickets off;

    # $realpath_root binds each request to the release `current` pointed to
    # when it started; an atomic symlink switch needs no FPM reload.
    root /var/www/starter/current/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/starter.access.json starter_json;
    error_log /var/log/nginx/starter.error.log warn;

    # DAM uploads: 50 MB (config/media.php) plus multipart overhead; keep in
    # sync with post_max_size/upload_max_filesize in the FPM pool.
    client_max_body_size 52m;

    include /etc/nginx/snippets/starter-security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli only when the module is installed (e.g. libnginx-mod-http-brotli-*):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    # Hidden files (.env, .git, ...) except ACME/.well-known.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Vite output is content-hashed: cache forever, never revalidate.
    location ^~ /build/assets/ {
        access_log off;
        include /etc/nginx/snippets/starter-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Public DAM variants: content-hashed names, clean images only.
    location ^~ /storage/media/ {
        access_log off;
        include /etc/nginx/snippets/starter-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed Vite manifests stay revalidated on every request.
    location ^~ /build/ {
        include /etc/nginx/snippets/starter-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
        access_log off;
        include /etc/nginx/snippets/starter-security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri /index.php?$query_string;
    }

    # Probes are frequent; keep them out of the access log.
    location = /health/ready {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # HTML/Inertia responses keep the Cache-Control set by Laravel.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/starter.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Trusted request ID for logs (App\Logging\AddRuntimeContext); a
        # non-HTTP_ parameter cannot be set by a client header.
        fastcgi_param REQUEST_ID $request_id;
        fastcgi_hide_header X-Powered-By;
        # Inertia/SSR responses carry large Link/Set-Cookie headers.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }
}
