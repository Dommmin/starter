server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;

    # Text compression. The official nginx image ships without the brotli
    # module, so only gzip is enabled; precompressed *.gz files are not built.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Vite output is content-hashed: cache forever, never revalidate.
    location ^~ /build/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unhashed Vite manifests stay revalidated on every request.
    location ^~ /build/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Unhashed static files in public/: short cache with revalidation.
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # HTML/Inertia responses keep the Cache-Control set by Laravel.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
