name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-convention:
    name: commit-convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      # Dependabot titles name the bumped action and both versions, which
      # can exceed the 72-character header limit; the format is fixed upstream.
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$COMMIT_MESSAGE" | npx commitlint --verbose
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            npx commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to "$AFTER" --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction
      - name: Check generated TypeScript contracts are up to date
        run: |
          composer types:generate
          git diff --exit-code -- resources/js/types/generated.d.ts
      - name: Check AI and deployment configuration
        run: python3 -m unittest discover -s tests/ai -v
      - name: Test local environment bootstrap
        run: node --test scripts/dev-environment.test.mjs scripts/starter-sync.test.mjs scripts/registration-routes.test.mjs
      - name: Enforce localization catalog contract
        run: composer check:i18n
      - name: Enforce UI contract on changed source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/check-ui-contract.mjs --base "$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = push ] && [ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            node scripts/check-ui-contract.mjs --base "$PUSH_BEFORE_SHA"
          else
            echo "Brak referencji bazowej dla bramki UI; pomijam kontrolę różnic."
          fi
      # Sign-up is off by default (.env.example, app:init-project), and
      # Wayfinder then skips the registration routes; the build must not
      # depend on them. The next step rebuilds with sign-up switched on.
      - name: Build frontend and SSR assets with registration disabled
        env:
          APP_REGISTRATION_ENABLED: 'false'
        run: npm run build:ssr
      # build:ssr also runs the client build, so the budget step below still
      # reads public/build; the SSR smoke catches browser-only APIs at module
      # level in the SSR entry long before the e2e job.
      - name: Build frontend and SSR assets
        env:
          APP_REGISTRATION_ENABLED: 'true'
        run: npm run build:ssr
      - name: Enforce bundle budget
        run: npm run check:budget
      - name: Smoke test SSR rendering and i18n isolation
        run: npm run test:ssr
      - name: Run quality checks
        run: composer ci:check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Supply-chain gate for the committed lockfiles: both audits fail the job
    # on a known advisory (composer: any; npm: high/critical) in runtime
    # dependencies. A failure to download the advisory database is a failure,
    # not a pass. Exceptions need a human-approved, dated justification
    # (docs/foundation/03-testing-and-quality.md), never a lower threshold.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit Composer runtime dependencies from the lockfile
        run: composer audit --locked --no-dev --format=plain
      - name: Audit npm runtime dependencies from the lockfile
        run: npm audit --omit=dev --audit-level=high

  tests-pgsql:
    name: tests-pgsql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The full Pest suite against PostgreSQL, one of the two supported
    # production engines (DB_CONNECTION), while `quality` keeps the fast
    # in-memory SQLite run. A service container
    # uses the same image as compose.yaml without building the runtime image;
    # the credentials exist only inside this throwaway container.
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: starter_testing
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-testing-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter_testing"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: starter_testing
      DB_USERNAME: starter
      DB_PASSWORD: ci-testing-only
      DB_URL: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      # Job-level DB_* variables take precedence over .env.testing (SQLite).
      - name: Run Pest on PostgreSQL
        run: php artisan test --compact

  tests-mysql:
    name: tests-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The full Pest suite against MySQL 8.4, the default engine of new
    # projects (.env.example). Same image as compose.yaml; the credentials
    # exist only inside this throwaway container.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: starter_testing
          MYSQL_USER: starter
          MYSQL_PASSWORD: ci-testing-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-root-only --silent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: starter_testing
      DB_USERNAME: starter
      DB_PASSWORD: ci-testing-only
      DB_URL: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      # Job-level DB_* variables take precedence over .env.testing (SQLite).
      - name: Run Pest on MySQL
        run: php artisan test --compact

  generator-smoke:
    name: generator-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install JavaScript dependencies
        run: npm ci
      # Generates full-feature modules in a temporary copy of the checkout and
      # runs Pint, PHPStan, Pest, types, Wayfinder, npm run check and the UI
      # contract on them; the checkout itself is never modified.
      - name: Generate CRUD modules and verify them without manual fixes
        run: sh scripts/generator-smoke.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Docker/Makefile runtime as locally, configured only from the
      # committed .env.example (no secrets). ClamAV and the Vite dev server are
      # never started: `make e2e` brings up web + queue (and their
      # dependencies) and serves the production build with the SSR server.
      - name: Prepare environment from example
        run: cp .env.example .env
      - name: Build runtime image and install locked dependencies
        run: |
          docker compose build app
          make deps
      - name: Start database services and migrate
        run: |
          docker compose --profile mysql up -d --wait mysql redis mailpit
          make artisan ARGS='key:generate --no-interaction'
          make artisan ARGS='migrate --no-interaction'
          make artisan ARGS='storage:link --no-interaction'
      - name: Run browser E2E journeys and web vitals
        run: make e2e
      - name: Dump service diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml --profile e2e ps -a || true
          docker inspect --format '{{json .State.Health}}' starter-local-web-1 starter-local-app-1 || true
          docker compose -f compose.yaml -f compose.e2e.yaml --profile e2e logs --no-color --tail=150 web app ssr queue || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --profile e2e --profile mysql down --volumes --remove-orphans
