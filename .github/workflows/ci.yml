name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-convention:
    name: commit-convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$COMMIT_MESSAGE" | npx commitlint --verbose
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            npx commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to "$AFTER" --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction
      - name: Check generated TypeScript contracts are up to date
        run: |
          composer types:generate
          git diff --exit-code -- resources/js/types/generated.d.ts
      - name: Check AI and deployment configuration
        run: python3 -m unittest discover -s tests/ai -v
      - name: Enforce localization catalog contract
        run: composer check:i18n
      - name: Enforce UI contract on changed source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/check-ui-contract.mjs --base "$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = push ] && [ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            node scripts/check-ui-contract.mjs --base "$PUSH_BEFORE_SHA"
          else
            echo "Brak referencji bazowej dla bramki UI; pomijam kontrolę różnic."
          fi
      - name: Build frontend assets
        run: npm run build
      - name: Enforce bundle budget
        run: npm run check:budget
      - name: Run quality checks
        run: composer ci:check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Docker/Makefile runtime as locally, configured only from the
      # committed .env.example (no secrets). ClamAV and the Vite dev server are
      # never started: `make e2e` brings up web + queue (and their
      # dependencies) and serves the production build with the SSR server.
      - name: Prepare environment from example
        run: cp .env.example .env
      - name: Build runtime image and install locked dependencies
        run: |
          docker compose build app
          make deps
      - name: Start database services and migrate
        run: |
          docker compose up -d --wait postgres redis mailpit
          make artisan ARGS='key:generate --no-interaction'
          make artisan ARGS='migrate --no-interaction'
          make artisan ARGS='storage:link --no-interaction'
      - name: Run browser E2E journeys and web vitals
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
