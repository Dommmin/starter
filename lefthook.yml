pre-commit:
    parallel: true
    commands:
        staged-diff:
            run: git diff --cached --check
        php-format:
            glob: '*.php'
            run: vendor/bin/pint --test -- {staged_files}
        frontend-check:
            glob: '*.{ts,tsx,js,jsx,css}'
            run: npm run check -- {staged_files}
        ui-contract:
            glob:
                - 'resources/js/**/*.{ts,tsx,js,jsx}'
                - 'resources/css/**/*.css'
            run: node scripts/check-ui-contract.mjs --staged
        i18n-contract:
            glob:
                - 'lang/**/*.php'
                - 'config/localization.php'
                - 'app/Services/Localization/**/*.php'
                - 'app/**/*.php'
                - 'routes/**/*.php'
                - 'resources/js/**/*.{ts,tsx,js,jsx}'
            run: composer check:i18n
        ai-configuration:
            glob:
                - '.agents/**/*'
                - '.claude/**/*'
                - '.codex/**/*'
                - 'AGENTS.md'
                - 'CLAUDE.md'
                - 'GEMINI.md'
                - 'tests/ai/**/*'
                - 'lefthook.yml'
                - 'commitlint.config.mjs'
                - '.github/workflows/**/*'
                - 'deploy.php'
            run: python3 -m unittest discover -s tests/ai -v

commit-msg:
    commands:
        conventional-commit:
            run: npx commitlint --edit {1}
